<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA Core -->
    <meta name="theme-color" content="#0d2818" />
    <meta name="description" content="RetailersHub — Apply to become a verified retailer and start selling across Nigeria." />

    <!-- Favicon (local for reliability) -->
    <link rel="icon" type="image/jpeg" href="/pwa-icon.jpg" />

    <!-- Apple PWA -->
    <link rel="apple-touch-icon" href="/pwa-icon.jpg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RetailersHub" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RetailersHub — Apply & Start Selling in Nigeria</title>

    <!-- Open Graph -->
    <meta property="og:title" content="RetailersHub — Apply & Start Selling" />
    <meta property="og:description" content="Join RetailersHub — Apply to become a verified retailer and start selling different items across Nigeria." />
    <meta property="og:image" content="https://dpioixansygkjdbphfdj.supabase.co/storage/v1/object/public/hero-images/IMG-20260516-WA0000.jpg" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RetailersHub — Apply & Start Selling" />
    <meta name="twitter:description" content="Join RetailersHub — Apply to become a verified retailer and start selling different items across Nigeria." />
    <meta name="twitter:image" content="https://dpioixansygkjdbphfdj.supabase.co/storage/v1/object/public/hero-images/IMG-20260516-WA0000.jpg" />

    <!-- Google Fonts — loaded here so the browser fetches them in parallel
         with JS, not after JS runs. Eliminates the Flash of Unstyled Text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;700&family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;700&family=Raleway:wght@300;400;700&family=Dancing+Script:wght@400;700&family=Pacifico&family=Great+Vibes&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
